name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'foggybrain');
          assert.equal(pkg.private, true);
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: mkdir release-assets
      - run: pnpm pack --pack-destination release-assets
      - name: Generate Homebrew formula for stable releases
        if: ${{ !contains(github.ref_name, '-') }}
        run: node scripts/homebrew.mjs release-assets/foggybrain-*.tgz release-assets/foggybrain.rb
      - name: Generate checksum
        working-directory: release-assets
        run: |
          assets=(foggybrain-*.tgz)
          if [[ -f foggybrain.rb ]]; then assets+=(foggybrain.rb); fi
          sha256sum "${assets[@]}" > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Release archive (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - name: Verify checksum
        working-directory: release-assets
        run: shasum -a 256 -c SHA256SUMS
      - name: Test the exact release archive without development dependencies
        run: node scripts/test-package.mjs release-assets/foggybrain-*.tgz
      - name: Verify generated Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          node scripts/homebrew.mjs release-assets/foggybrain-*.tgz expected-formula.rb
          cmp expected-formula.rb release-assets/foggybrain.rb
          ruby -c release-assets/foggybrain.rb

  publish:
    needs: [checks, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          assets=(release-assets/foggybrain-*.tgz release-assets/SHA256SUMS)
          if [[ -f release-assets/foggybrain.rb ]]; then assets+=(release-assets/foggybrain.rb); fi
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag --draft --generate-notes --title "FoggyBrain $TAG" "${flags[@]}"
